onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "nord"
auto_switch = true

[ui]
sidebar_min_width = 36
sidebar_max_width = 48

[ui.sound]
enabled = true

[worktrees]
directory = "~/.worktrees"

[keys]
prefix = "ctrl+b"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
