[settings]
npm.package_manager = 'bun'

[tools]
'npm:npm' = '12.0.1'
'pnpm' = '12.5.1'

# ni
# https://github.com/antfu-collective/ni
'npm:@antfu/ni' = '30.2.0'

# fish-lsp
'npm:fish-lsp' = '1.1.4'

# yaml-language-server
'npm:yaml-language-server' = '1.24.0'

# hunk
# https://www.hunk.dev/
'npm:hunkdiff' = '0.22.0'

# Astro LSP
'npm:@astrojs/language-server' = '2.16.12'

'npm:@vtsls/language-server' = '0.3.0'

'npm:@earendil-works/pi-coding-agent' = { version = '0.86.1', bun_args = '--trust' } 

'npm:@pranshuparmar/witr' = '0.3.3'

