[settings]
npm.package_manager = 'bun'

[tools]
'npm:npm' = '12.2.0'
'pnpm' = '12.14.0'

# ni
# https://github.com/antfu-collective/ni
'npm:@antfu/ni' = '30.6.0'

# fish-lsp
'npm:fish-lsp' = '1.1.5'

# yaml-language-server
'npm:yaml-language-server' = '2.0.0'

# hunk
# https://www.hunk.dev/
'npm:hunkdiff' = '0.23.0'

# Astro LSP
'npm:@astrojs/language-server' = '2.17.2'

'npm:@earendil-works/pi-coding-agent' = { version = '1.3.0', bun_args = '--trust' } 

'npm:@pranshuparmar/witr' = '0.3.4'

'npm:opencode-ai' = '1.19.3'

'npm:ctx7' = '0.8.2'

